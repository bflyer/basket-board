<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">篮球战术板界面总览</title>
  <desc id="desc">标注步骤控制、播放速度、战术库、JSON、重置、保存视频、球场棋子和步骤注释的位置。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .label { fill:#f8fafc; font-size:18px; font-weight:700; }
      .small { fill:#dbeafe; font-size:14px; }
      .btn { fill:#0f3460; rx:7; }
      .warn { fill:#d97706; rx:7; }
      .primary { fill:#e94560; rx:7; }
      .call { fill:#38bdf8; stroke:#082f49; stroke-width:2; }
      .line { stroke:#38bdf8; stroke-width:3; fill:none; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#0b1023"/>
  <rect x="75" y="45" width="1050" height="670" rx="16" fill="#1a1a2e" stroke="#334155" stroke-width="2"/>
  <text x="600" y="82" text-anchor="middle" class="label" font-size="25">🏀 篮球战术板</text>

  <g transform="translate(130 102)">
    <rect class="btn" width="92" height="36"/><text x="46" y="24" text-anchor="middle" class="small">⬅ 上一步</text>
    <rect x="100" width="130" height="36" rx="7" fill="#16213e"/><text x="165" y="24" text-anchor="middle" class="small">步骤 2 / 3</text>
    <rect class="primary" x="238" width="106" height="36"/><text x="291" y="24" text-anchor="middle" class="small">✅ 完成步骤</text>
    <rect class="btn" x="352" width="100" height="36"/><text x="402" y="24" text-anchor="middle" class="small">▶ 播放全部</text>
    <rect x="460" width="150" height="36" rx="7" fill="#16213e"/><text x="475" y="23" class="small">速度</text><line x1="520" y1="18" x2="575" y2="18" stroke="#94a3b8" stroke-width="4"/><circle cx="548" cy="18" r="7" fill="#e94560"/><text x="585" y="23" class="small">0.5x</text>
    <rect class="btn" x="618" width="88" height="36"/><text x="662" y="24" text-anchor="middle" class="small">📚 战术库</text>
    <rect class="btn" x="714" width="104" height="36"/><text x="766" y="24" text-anchor="middle" class="small">💾 导出 JSON</text>
    <rect class="btn" x="826" width="94" height="36"/><text x="873" y="24" text-anchor="middle" class="small">📂 加载战术</text>
  </g>

  <g transform="translate(300 152)">
    <rect class="warn" width="100" height="34"/><text x="50" y="23" text-anchor="middle" class="small">↩ 撤销拖动</text>
    <rect class="warn" x="108" width="104" height="34"/><text x="160" y="23" text-anchor="middle" class="small">🔄 重置步骤</text>
    <rect class="btn" x="220" width="96" height="34"/><text x="268" y="23" text-anchor="middle" class="small">🗑 重置全部</text>
    <rect class="btn" x="324" width="104" height="34"/><text x="376" y="23" text-anchor="middle" class="small">📹 保存 MP4</text>
  </g>

  <g transform="translate(170 210)">
    <rect width="860" height="457" rx="8" fill="#c98d50" stroke="#fff" stroke-width="4"/>
    <line x1="430" y1="0" x2="430" y2="457" stroke="#fff" stroke-width="3"/>
    <circle cx="430" cy="228.5" r="72" fill="none" stroke="#fff" stroke-width="3"/>
    <rect x="0" y="125" width="165" height="207" fill="none" stroke="#fff" stroke-width="3"/>
    <rect x="695" y="125" width="165" height="207" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M165 145 A105 105 0 0 1 165 312" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M695 145 A105 105 0 0 0 695 312" fill="none" stroke="#fff" stroke-width="3"/>
    <g fill="#e63946" stroke="#fff" stroke-width="2">
      <circle cx="250" cy="150" r="19"/><circle cx="155" cy="225" r="19"/><circle cx="255" cy="315" r="19"/><circle cx="345" cy="190" r="19"/><circle cx="350" cy="285" r="19"/>
    </g>
    <g fill="#f4a261" stroke="#fff" stroke-width="2">
      <circle cx="610" cy="150" r="19"/><circle cx="705" cy="225" r="19"/><circle cx="605" cy="315" r="19"/><circle cx="515" cy="190" r="19"/><circle cx="510" cy="285" r="19"/>
    </g>
    <g class="small" text-anchor="middle" dominant-baseline="middle" font-weight="700">
      <text x="250" y="150">1</text><text x="155" y="225">2</text><text x="255" y="315">3</text><text x="345" y="190">4</text><text x="350" y="285">5</text>
      <text x="610" y="150" fill="#1f2937">1</text><text x="705" y="225" fill="#1f2937">2</text><text x="605" y="315" fill="#1f2937">3</text><text x="515" y="190" fill="#1f2937">4</text><text x="510" y="285" fill="#1f2937">5</text>
    </g>
    <circle cx="430" cy="228" r="14" fill="#fb8500" stroke="#ffdd75" stroke-width="3"/><text x="430" y="233" text-anchor="middle" font-size="11" fill="#fff">球</text>
    <path d="M250 150 C310 110 380 115 430 175" fill="none" stroke="#e63946" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  </g>

  <rect x="170" y="680" width="860" height="58" rx="8" fill="#16213e"/><text x="195" y="702" class="small" fill="#94a3b8">步骤注释</text><text x="195" y="725" class="small">1号借4号掩护向右侧突破，4号顺下。</text>

  <g>
    <path class="line" d="M110 120 L145 120" marker-end="url(#arrow)"/><circle class="call" cx="90" cy="120" r="20"/><text x="90" y="127" text-anchor="middle" class="label">1</text>
    <path class="line" d="M1090 120 L1030 120" marker-end="url(#arrow)"/><circle class="call" cx="1110" cy="120" r="20"/><text x="1110" y="127" text-anchor="middle" class="label">2</text>
    <path class="line" d="M95 180 L295 170" marker-end="url(#arrow)"/><circle class="call" cx="75" cy="180" r="20"/><text x="75" y="187" text-anchor="middle" class="label">3</text>
    <path class="line" d="M1110 180 L735 170" marker-end="url(#arrow)"/><circle class="call" cx="1130" cy="180" r="20"/><text x="1130" y="187" text-anchor="middle" class="label">4</text>
    <path class="line" d="M105 360 L170 360" marker-end="url(#arrow)"/><circle class="call" cx="85" cy="360" r="20"/><text x="85" y="367" text-anchor="middle" class="label">5</text>
    <path class="line" d="M1095 360 L1030 360" marker-end="url(#arrow)"/><circle class="call" cx="1115" cy="360" r="20"/><text x="1115" y="367" text-anchor="middle" class="label">6</text>
    <path class="line" d="M110 705 L170 705" marker-end="url(#arrow)"/><circle class="call" cx="90" cy="705" r="20"/><text x="90" y="712" text-anchor="middle" class="label">7</text>
    <path class="line" d="M1090 705 L1030 705" marker-end="url(#arrow)"/><circle class="call" cx="1110" cy="705" r="20"/><text x="1110" y="712" text-anchor="middle" class="label">8</text>
  </g>
</svg>
