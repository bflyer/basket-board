<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">篮球战术板五种路线类型</title>
  <desc id="desc">实线箭头表示无球跑动，波浪箭头表示运球突破，虚线箭头表示传球，末端横杠表示挡拆掩护，双线箭头表示投篮。</desc>
  <defs>
    <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.name{fill:#f8fafc;font-size:19px;font-weight:700}.hint{fill:#94a3b8;font-size:13px}.line{fill:none;stroke:#f8fafc;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.card{fill:#16213e;stroke:#334155;stroke-width:2}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f8fafc"/></marker>
  </defs>
  <rect width="1100" height="300" rx="16" fill="#0b1023"/>
  <text x="550" y="42" text-anchor="middle" class="name" font-size="25">路线类型图例</text>
  <g transform="translate(25 70)">
    <rect class="card" width="190" height="195" rx="12"/><text x="95" y="36" text-anchor="middle" class="name">无球跑动</text><path class="line" d="M30 92C72 64 119 119 158 84" marker-end="url(#arrow)"/><text x="95" y="154" text-anchor="middle" class="hint">实线箭头</text><text x="95" y="176" text-anchor="middle" class="hint">空切、跑位、移动</text>
  </g>
  <g transform="translate(240 70)">
    <rect class="card" width="190" height="195" rx="12"/><text x="95" y="36" text-anchor="middle" class="name">运球突破</text><path class="line" d="M28 92C38 65 48 119 58 92S78 65 88 92S108 119 118 92S138 65 158 88" marker-end="url(#arrow)"/><text x="95" y="154" text-anchor="middle" class="hint">波浪箭头</text><text x="95" y="176" text-anchor="middle" class="hint">持球运球、突破</text>
  </g>
  <g transform="translate(455 70)">
    <rect class="card" width="190" height="195" rx="12"/><text x="95" y="36" text-anchor="middle" class="name">传球</text><path class="line" d="M28 90H160" stroke-dasharray="12 9" marker-end="url(#arrow)"/><text x="95" y="154" text-anchor="middle" class="hint">虚线箭头</text><text x="95" y="176" text-anchor="middle" class="hint">篮球传递方向</text>
  </g>
  <g transform="translate(670 70)">
    <rect class="card" width="190" height="195" rx="12"/><text x="95" y="36" text-anchor="middle" class="name">挡拆掩护</text><path class="line" d="M28 90H157M157 70V110"/><text x="95" y="154" text-anchor="middle" class="hint">末端横杠</text><text x="95" y="176" text-anchor="middle" class="hint">掩护路线与站位</text>
  </g>
  <g transform="translate(885 70)">
    <rect class="card" width="190" height="195" rx="12"/><text x="95" y="36" text-anchor="middle" class="name">投篮</text><path class="line" d="M28 84H158M28 96H158" marker-end="url(#arrow)"/><text x="95" y="154" text-anchor="middle" class="hint">双线箭头</text><text x="95" y="176" text-anchor="middle" class="hint">篮球指向篮筐</text>
  </g>
</svg>
