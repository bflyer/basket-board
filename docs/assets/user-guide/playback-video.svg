<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">播放、实时变速、停止和保存 MP4</title><desc id="desc">左侧展示播放中的停止按钮和速度滑块，右侧展示视频保存流程。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.h{fill:#fff;font-size:22px;font-weight:700}.t{fill:#dbeafe;font-size:15px}.muted{fill:#94a3b8;font-size:13px}.flow{fill:#16213e;stroke:#38bdf8;stroke-width:2}.arrow{stroke:#38bdf8;stroke-width:4;fill:none}</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9z" fill="#38bdf8"/></marker></defs>
  <rect width="1200" height="620" fill="#0b1023"/><text x="600" y="45" text-anchor="middle" class="h" font-size="28">播放控制与 MP4 保存</text>
  <rect x="55" y="85" width="520" height="470" rx="14" fill="#1a1a2e" stroke="#334155" stroke-width="2"/><text x="85" y="125" class="h">播放过程中</text>
  <rect x="90" y="150" width="160" height="45" rx="7" fill="#d97706"/><text x="170" y="179" text-anchor="middle" class="t" font-size="17">⏹ 停止播放</text>
  <rect x="270" y="150" width="260" height="45" rx="7" fill="#16213e"/><text x="288" y="178" class="t">速度</text><line x1="345" y1="172" x2="455" y2="172" stroke="#94a3b8" stroke-width="5"/><circle cx="400" cy="172" r="9" fill="#e94560"/><text x="474" y="178" class="t">0.5x</text>
  <text x="90" y="215" class="t">• “播放全部”连续播放；“逐步播放”每次只播放一步。</text><text x="90" y="245" class="t">• 点击停止可立即中断当前移动或步骤间停顿。</text><text x="90" y="275" class="t">• 播放时可实时选择 0.25x、0.5x、0.75x、1x。</text>
  <rect x="90" y="320" width="440" height="170" rx="8" fill="#c98d50" stroke="#fff" stroke-width="3"/><line x1="310" y1="320" x2="310" y2="490" stroke="#fff" stroke-width="2"/><circle cx="310" cy="405" r="35" fill="none" stroke="#fff" stroke-width="2"/><circle cx="180" cy="405" r="18" fill="#e63946" stroke="#fff" stroke-width="2"/><path d="M180 405C245 350 340 355 410 395" fill="none" stroke="#e63946" stroke-width="5" stroke-dasharray="8 6" marker-end="url(#a)"/><circle cx="250" cy="420" r="13" fill="#fb8500" stroke="#fff" stroke-width="2"/>
  <rect x="90" y="505" width="440" height="34" rx="6" fill="#16213e"/><text x="310" y="528" text-anchor="middle" class="t">播放步骤 2 / 3　“4号顺下，1号观察协防”</text>

  <rect x="625" y="85" width="520" height="470" rx="14" fill="#1a1a2e" stroke="#334155" stroke-width="2"/><text x="655" y="125" class="h">点击“📹 保存 MP4”后</text>
  <rect class="flow" x="690" y="155" width="390" height="55" rx="8"/><text x="885" y="188" text-anchor="middle" class="t">自动播放全部步骤并录制画面</text>
  <path class="arrow" d="M885 210L885 245" marker-end="url(#a)"/>
  <rect class="flow" x="690" y="255" width="390" height="55" rx="8"/><text x="885" y="278" text-anchor="middle" class="t">浏览器能直接录制 MP4？</text><text x="885" y="299" text-anchor="middle" class="muted">自动判断，不需要用户选择</text>
  <path class="arrow" d="M800 310L745 350" marker-end="url(#a)"/><text x="745" y="330" class="t" fill="#86efac">能</text><path class="arrow" d="M970 310L1025 350" marker-end="url(#a)"/><text x="1015" y="330" class="t" fill="#fde68a">不能</text>
  <rect class="flow" x="650" y="365" width="200" height="75" rx="8"/><text x="750" y="395" text-anchor="middle" class="t">直接下载 MP4</text><text x="750" y="420" text-anchor="middle" class="muted">无需加载编码器</text>
  <rect class="flow" x="920" y="365" width="200" height="75" rx="8"/><text x="1020" y="393" text-anchor="middle" class="t">自动转码 MP4</text><text x="1020" y="418" text-anchor="middle" class="muted">首次下载约 32MB</text>
  <path class="arrow" d="M750 440L820 485" marker-end="url(#a)"/><path class="arrow" d="M1020 440L950 485" marker-end="url(#a)"/>
  <rect x="760" y="485" width="250" height="45" rx="8" fill="#16a34a"/><text x="885" y="514" text-anchor="middle" class="h" font-size="18">下载最终 MP4</text>
  <text x="885" y="575" text-anchor="middle" class="muted">转码失败时才会自动保留 WebM 备份，防止录像丢失。</text>
</svg>
