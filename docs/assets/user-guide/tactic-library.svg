<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">战术库界面说明</title><desc id="desc">显示战术名称、基础描述、文件夹设置、公开模板和本机战术区域。</desc>
  <defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.h{fill:#fff;font-size:20px;font-weight:700}.t{fill:#dbeafe;font-size:14px}.muted{fill:#94a3b8;font-size:13px}.num{fill:#fff;font-size:17px;font-weight:700}.line{stroke:#38bdf8;stroke-width:3;fill:none}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#38bdf8"/></marker></defs>
  <rect width="1200" height="720" fill="#070b18"/><rect x="120" y="35" width="960" height="650" rx="14" fill="#16213e" stroke="#475569" stroke-width="2"/>
  <text x="155" y="75" class="h" font-size="25">📚 战术库</text><text x="1040" y="75" text-anchor="middle" class="h" font-size="28">×</text><line x1="120" y1="95" x2="1080" y2="95" stroke="#334155"/>
  <rect x="155" y="120" width="890" height="110" rx="9" fill="#0f3460"/>
  <text x="175" y="145" class="muted">当前战术名称</text><rect x="175" y="154" width="220" height="48" rx="6" fill="#101a33" stroke="#64748b"/><text x="190" y="184" class="t">牛角挡拆</text>
  <text x="420" y="145" class="muted">战术基础描述</text><rect x="420" y="154" width="395" height="48" rx="6" fill="#101a33" stroke="#64748b"/><text x="435" y="176" class="t">双高位落位，4号挡拆后顺下，</text><text x="435" y="195" class="t">弱侧保持空间。</text>
  <rect x="835" y="154" width="185" height="48" rx="6" fill="#e94560"/><text x="927" y="184" text-anchor="middle" class="t">保存到本机和文件夹</text>
  <rect x="155" y="245" width="890" height="58" rx="7" fill="#101a33" stroke="#334155"/><circle cx="180" cy="274" r="8" fill="#4ade80"/><text x="198" y="279" class="t">已连接文件夹：我的篮球战术（读取到 6 个战术）</text><rect x="770" y="257" width="145" height="34" rx="5" fill="#0f3460"/><text x="842" y="279" text-anchor="middle" class="t">选择/更改文件夹</text><rect x="925" y="257" width="95" height="34" rx="5" fill="#0f3460"/><text x="972" y="279" text-anchor="middle" class="t">重新读取</text>
  <text x="155" y="338" class="h">公开模板</text>
  <g transform="translate(155 355)"><rect width="275" height="135" rx="8" fill="#101a33" stroke="#334155"/><text x="16" y="28" class="h" font-size="17">牛角挡拆</text><text x="16" y="55" class="t">双高位挡拆，内线顺下。</text><text x="16" y="79" class="muted">3 个步骤 · 半场进攻</text><rect x="16" y="94" width="115" height="29" rx="5" fill="#0f3460"/><text x="73" y="114" text-anchor="middle" class="t">加载到战术板</text><rect x="140" y="94" width="95" height="29" rx="5" fill="#0f3460"/><text x="187" y="114" text-anchor="middle" class="t">导出 JSON</text></g>
  <g transform="translate(445 355)"><rect width="275" height="135" rx="8" fill="#101a33" stroke="#334155"/><text x="16" y="28" class="h" font-size="17">三线快攻</text><text x="16" y="55" class="t">中路推进，两翼快速下顺。</text><text x="16" y="79" class="muted">3 个步骤 · 转换进攻</text><rect x="16" y="94" width="115" height="29" rx="5" fill="#0f3460"/><text x="73" y="114" text-anchor="middle" class="t">加载到战术板</text></g>
  <g transform="translate(735 355)"><rect width="275" height="135" rx="8" fill="#101a33" stroke="#334155"/><text x="16" y="28" class="h" font-size="17">底线发球双掩护</text><text x="16" y="55" class="t">连续掩护，2号反切篮下。</text><text x="16" y="79" class="muted">3 个步骤 · 底线球</text><rect x="16" y="94" width="115" height="29" rx="5" fill="#0f3460"/><text x="73" y="114" text-anchor="middle" class="t">加载到战术板</text></g>
  <text x="155" y="525" class="h">我的本机战术</text><rect x="155" y="542" width="855" height="92" rx="8" fill="#101a33" stroke="#334155"/><text x="175" y="570" class="h" font-size="17">周六训练：挡拆变化</text><text x="175" y="596" class="t">保存在浏览器和已选择文件夹，可加载、导出或删除。</text><rect x="735" y="568" width="80" height="32" rx="5" fill="#0f3460"/><text x="775" y="589" text-anchor="middle" class="t">加载</text><rect x="825" y="568" width="80" height="32" rx="5" fill="#0f3460"/><text x="865" y="589" text-anchor="middle" class="t">导出</text><rect x="915" y="568" width="70" height="32" rx="5" fill="#7f1d1d"/><text x="950" y="589" text-anchor="middle" class="t">删除</text>
  <g><circle cx="70" cy="172" r="21" fill="#38bdf8"/><text x="70" y="178" text-anchor="middle" class="num">1</text><path class="line" d="M92 172L155 172" marker-end="url(#a)"/><circle cx="1135" cy="274" r="21" fill="#38bdf8"/><text x="1135" y="280" text-anchor="middle" class="num">2</text><path class="line" d="M1112 274L1045 274" marker-end="url(#a)"/><circle cx="70" cy="415" r="21" fill="#38bdf8"/><text x="70" y="421" text-anchor="middle" class="num">3</text><path class="line" d="M92 415L155 415" marker-end="url(#a)"/><circle cx="1135" cy="585" r="21" fill="#38bdf8"/><text x="1135" y="591" text-anchor="middle" class="num">4</text><path class="line" d="M1112 585L1010 585" marker-end="url(#a)"/></g>
</svg>
